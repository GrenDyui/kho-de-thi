name: Auto Sync OLM Exams

on:
  schedule:
    # Chạy mỗi 1 giờ một lần vào phút thứ 0
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công từ giao diện GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OLM Sync Pipeline
        env:
          OLM_COOKIES: ${{ secrets.OLM_COOKIES }}
          OLM_SESSION: ${{ secrets.OLM_SESSION }}
        run: |
          python scripts/sync_olm.py

      - name: Commit and push changes if any
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/exams.json
          if git diff --staged --quiet; then
            echo "No new exams or updates detected."
          else
            git commit -m "chore(data): auto sync exams from OLM [skip ci]"
            git push origin main
          fi
