name: Auto Sync OLM Exams

on:
  schedule:
    # Runs every 1 hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-olm:
    name: Sync OLM Lessons & Exams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install python-docx requests
          fi

      - name: Run OLM Sync Pipeline
        env:
          OLM_COOKIES: ${{ secrets.OLM_COOKIES }}
          OLM_SESSION: ${{ secrets.OLM_SESSION }}
        run: |
          python scripts/sync_olm.py --exams-json data/exams.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exams.json
          if git diff --staged --quiet; then
            echo "No changes in data/exams.json to commit."
          else
            git commit -m "chore(sync): auto-sync OLM exams [skip ci]"
            git push origin main
          fi
